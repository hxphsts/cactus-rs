# Pinned Cactus Compute Needle 3 engine release.
#
# `build.rs` reads this file with `include_str!` and a small `key = "value"` scanner, so the
# syntax stays a strict subset of TOML: comments, one table header, and quoted scalar values.
#
# To move the pin: bump `commit`, download every `<platform>/libneedle.a` from
# `https://huggingface.co/<repo>/resolve/<commit>/<platform>/libneedle.a`, and replace the
# digests below with `shasum -a 256` output. All 15 platforms ship the same `needle.h`
# (sha256 90f347f9dca1199de79967ab199a56e0588bd473fe306051f8d80d146976a324), vendored as
# `include/needle.h` for reference.

