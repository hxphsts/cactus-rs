# Pinned Cactus Compute engine release.
#
# `build.rs` reads this file with `include_str!` and a small `key = "value"` scanner, so the
# syntax stays a strict subset of TOML: comments, one table header, and quoted scalar values.
#
# One engine runs Needle 3 (text), Whistle (speech) and Mirage (vision). Upstream publishes it as
# `releases/<release>/<platform>/libcactus.a`, with a `manifest.json` per release that lists the
# size and SHA-256 of every file.
#
# To move the pin: bump `commit` and `release`, and replace the digests below with the
# `<platform>/libcactus.a` entries of
# `https://huggingface.co/<repo>/resolve/<commit>/releases/<release>/manifest.json`. All
# platforms ship the same `cactus.h`
# (sha256 9be7eb25b1d89180495d04a0d2c27053f282dac85add50cacc48d73302819d9d), vendored as
# `include/cactus.h` for reference.

repo = "Cactus-Compute/cactus"
commit = "d2c5cd70432ed78345f3ba6b620bff2feeec6c86"
release = "4.1.1"

