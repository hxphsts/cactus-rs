# cargo-deny policy, checked in CI by the `deny` job: `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails the check.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Only what the dependency tree actually needs. Add a licence here deliberately, not by habit.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
