name: Release

# Publishes both crates and creates the GitHub release when a version tag is pushed.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A release is a tag on main. A tag on any other commit stops here, before anything runs.
      - name: tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Both crates ship at the tag's version, and cactus-rs asks for exactly that cactus-sys.
      - name: tag matches both crate versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          for crate in cactus-sys cactus-rs; do
            found=$(jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version' "$RUNNER_TEMP/metadata.json")
            [ "$found" = "$version" ] || { echo "$crate is at $found, but the tag is $GITHUB_REF_NAME"; exit 1; }
          done
          requirement=$(jq -r '.packages[] | select(.name == "cactus-rs") | .dependencies[] | select(.name == "cactus-sys") | .req' "$RUNNER_TEMP/metadata.json")
          case "$requirement" in
            "^$version" | "=$version") ;;
            *) echo "cactus-rs requires cactus-sys $requirement, not $version"; exit 1 ;;
          esac
      # CHANGELOG.md is the one source of release notes, so the version needs a dated, non-empty section.
      - name: changelog has a section for the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          heading="## [$version] - "
          grep -qE "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md ||
            { echo "CHANGELOG.md has no '${heading}YYYY-MM-DD' heading"; exit 1; }
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md | grep -q '[^[:space:]]' ||
            { echo "the CHANGELOG.md section for $version is empty"; exit 1; }
      - name: pins agree everywhere they are copied
        run: .github/scripts/check-pins.sh
      # Against the latest crates.io release. DOCS_RS keeps the builds from fetching the engine.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: cactus-sys, cactus-rs
          rust-toolchain: manual
        env:
          DOCS_RS: "1"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all --all-features
      - run: cargo package --workspace

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # A version that is already on crates.io is skipped, so re-running a tag is harmless.
      - name: which crates still need publishing
        id: missing
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in cactus-sys cactus-rs; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "cactus-rs-release" "https://crates.io/api/v1/crates/$crate/$version")
            case "$code" in
              200) echo "$crate $version is already published"; echo "$crate=false" >> "$GITHUB_OUTPUT" ;;
              404) echo "$crate $version will be published"; echo "$crate=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "crates.io answered $code for $crate $version"; exit 1 ;;
            esac
          done
      - uses: dtolnay/rust-toolchain@stable
        if: steps.missing.outputs.cactus-sys == 'true' || steps.missing.outputs.cactus-rs == 'true'
      - run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev
        if: steps.missing.outputs.cactus-sys == 'true' || steps.missing.outputs.cactus-rs == 'true'
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.missing.outputs.cactus-sys == 'true' || steps.missing.outputs.cactus-rs == 'true'
      # The safe crate depends on the sys crate, so the order matters.
      - run: cargo publish -p cactus-sys
        if: steps.missing.outputs.cactus-sys == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: cargo publish -p cactus-rs
        if: steps.missing.outputs.cactus-rs == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The tagged version's CHANGELOG.md section, verbatim; `verify` already checked it exists.
      - name: release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          printf '\n**Crates:** [cactus-rs %s](https://crates.io/crates/cactus-rs/%s) · [cactus-sys %s](https://crates.io/crates/cactus-sys/%s) · [docs](https://docs.rs/cactus-rs/%s)\n' \
            "$version" "$version" "$version" "$version" "$version" >> notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
