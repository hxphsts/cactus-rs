name: Upstream pins

# Weekly: has Cactus Compute published an engine release newer than the pinned one, or changed a
# weight file? On drift, one issue per repository carries everything needed to move the pin.
on:
  schedule:
    - cron: "37 5 * * 1" # Mondays 05:37 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Two runs at once would each file the same drift issue.
concurrency:
  group: pins
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compare upstream with the pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          hub=https://huggingface.co
          prebuilt=cactus-sys/prebuilt.toml

          fetch() { curl -sSfL --retry 5 --retry-all-errors "$@"; }
          head_of() { fetch "$hub/api/models/$1" | jq -er .sha; }
          tree_of() { fetch "$hub/api/models/$1/tree/$2${3:+/$3}"; }
          rust_const() { sed -nE "s/^pub const $1: &str = \"([0-9a-f]+)\";$/\\1/p" "$2"; }

          # Opens the repository's drift issue, or retitles and rewrites the open one.
          file_issue() { # file_issue REPO WHAT BODY_FILE
            local title="Upstream pin drift: $1 $2" number
            number=$(gh issue list --state open --search "\"Upstream pin drift: $1\" in:title" \
              --json number,title --jq "[.[] | select(.title | startswith(\"Upstream pin drift: $1 \"))][0].number // empty")
            if [ -n "$number" ]; then
              gh issue edit "$number" --title "$title" --body-file "$3"
            else
              gh issue create --title "$title" --body-file "$3"
            fi
          }

          # The engine: one folder per release under releases/, each with a manifest.json that
          # lists the size and SHA-256 of every file. Drift is a release newer than the pinned one.
          engine_repo=$(sed -nE 's/^repo = "([^"]+)"$/\1/p' "$prebuilt")
          engine_pin=$(sed -nE 's/^release = "([^"]+)"$/\1/p' "$prebuilt")
          header_pin=$(sed -nE 's/^#.*sha256 ([0-9a-f]{64}).*/\1/p' "$prebuilt" | head -n1)
          for name in engine_repo engine_pin header_pin; do
            [ -n "${!name}" ] || { echo "could not read $name from $prebuilt"; exit 1; }
          done
          engine_head=$(head_of "$engine_repo")
          latest=$(tree_of "$engine_repo" "$engine_head" releases |
            jq -r '.[] | select(.type == "directory") | .path | split("/")[1]' | sort -V | tail -n1)
          [ -n "$latest" ] || { echo "no releases found in $engine_repo"; exit 1; }
          if [ "$latest" != "$engine_pin" ]; then
            manifest=$(fetch "$hub/$engine_repo/resolve/$engine_head/releases/$latest/manifest.json")
            body=$(mktemp)
            old_platforms=$(sed -n '/^\[sha256\]/,$p' "$prebuilt" | sed -nE 's/^([a-z0-9_-]+) = .*/\1/p' | sort)
            new_platforms=$(jq -r '.files | keys[] | select(endswith("/libcactus.a")) | split("/")[0]' <<< "$manifest" | sort)
            headers=$(jq -r '[.files | to_entries[] | select(.key | endswith("/cactus.h")) | .value.sha256] | unique | join(" ")' <<< "$manifest")
            {
              echo "\`$engine_repo\` has release \`$latest\` at [\`$engine_head\`]($hub/$engine_repo/tree/$engine_head/releases/$latest); \`$prebuilt\` pins \`$engine_pin\`."
              echo
              echo "### \`$prebuilt\`"
              echo
              echo '```toml'
              echo "commit = \"$engine_head\""
              echo "release = \"$latest\""
              echo
              echo "# sha256 of \`releases/<release>/<platform>/libcactus.a\` at the commit above."
              echo "[sha256]"
              jq -r '.files | to_entries[] | select(.key | endswith("/libcactus.a")) | "\(.key | split("/")[0]) = \"\(.value.sha256)\""' <<< "$manifest" | sort
              echo '```'
              echo
              echo "### \`cactus.h\`"
              echo
              if [ "$headers" = "$header_pin" ]; then
                echo "Unchanged (sha256 \`$header_pin\`)."
              else
                echo "Changed: sha256 \`$headers\`, pinned \`$header_pin\`. Replace \`cactus-sys/include/cactus.h\`, update the comment in \`$prebuilt\` and \`cactus-sys/include/README.md\`, and bring \`cactus-sys/src/engine.rs\` in line; \`cargo test -p cactus-sys --test abi\` says where they differ."
              fi
              echo
              echo "### Platforms"
              echo
              platform_diff=$(diff -u --label pinned --label upstream <(echo "$old_platforms") <(echo "$new_platforms") || true)
              if [ -z "$platform_diff" ]; then
                echo "The same $(echo "$new_platforms" | wc -l | tr -d ' ') native platforms as the pin."
              else
                printf '%s\n%s\n%s\n' '```diff' "$platform_diff" '```'
                echo "Map a new native platform in \`cactus-sys/build.rs\` before pinning it."
              fi
              echo
              echo "Then run \`.github/scripts/check-pins.sh\` and the \`cactus-sys\` probe tests with weights, which re-measure the engine's contracts."
            } > "$body"
            cat "$body"
            file_issue "$engine_repo" "$latest" "$body"
          fi

          # The weights: one file per repository. Upstream commits to these repositories for
          # reasons that do not touch the weights, so drift is a change in the file's digest.
          weights() { # weights SOURCE_FILE WEIGHT_FILE
            local repo pin_rev pin_sha head now size body
            repo=$(sed -nE 's/^    repo: "([^"]+)",$/\1/p' "$1")
            pin_rev=$(rust_const WEIGHTS_REVISION "$1")
            pin_sha=$(rust_const WEIGHTS_SHA256 "$1")
            for name in repo pin_rev pin_sha; do
              [ -n "${!name}" ] || { echo "could not read $name from $1"; exit 1; }
            done
            head=$(head_of "$repo")
            now=$(tree_of "$repo" "$head" | jq -r --arg f "$2" '.[] | select(.path == $f) | .lfs.oid // empty')
            size=$(tree_of "$repo" "$head" | jq -r --arg f "$2" '.[] | select(.path == $f) | .size')
            [ -n "$now" ] || { echo "$repo has no $2 in LFS at $head"; exit 1; }
            [ "$now" != "$pin_sha" ] || return 0
            body=$(mktemp)
            {
              echo "\`$2\` in \`$repo\` changed at [\`$head\`]($hub/$repo/tree/$head); \`$1\` pins \`$pin_rev\`."
              echo
              echo '```rust'
              echo "pub const WEIGHTS_REVISION: &str = \"$head\";"
              echo "pub const WEIGHTS_SHA256: &str = \"$now\";"
              echo '```'
              echo
              echo "\`$2\`: $size bytes."
              echo
              echo "Then run \`.github/scripts/check-pins.sh\`, update the size in the docs, re-measure the conformance baselines and add a CHANGELOG entry."
            } > "$body"
            cat "$body"
            file_issue "$repo" "${now:0:12}" "$body"
          }
          weights cactus-rs/src/needle/weights.rs needle3.cact
          weights cactus-rs/src/whistle/weights.rs whistle.cact
