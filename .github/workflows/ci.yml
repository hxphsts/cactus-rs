name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Two runners because the crate links a native static library: the archive,
  # the C++ runtime and the link line all differ per OS.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
      # The weights the engine tests run against, read from the constants the crate itself pins,
      # so a pin moves in one place: each model's WEIGHTS_REVISION and WEIGHTS_SHA256.
      - name: read the weight pins
        run: |
          rust_const() { sed -nE "s/^pub const $1: &str = \"([0-9a-f]+)\";$/\\1/p" "$2"; }
          needle_repo=$(sed -nE 's/^    repo: "([^"]+)",$/\1/p' cactus-rs/src/needle/weights.rs)
          needle_rev=$(rust_const WEIGHTS_REVISION cactus-rs/src/needle/weights.rs)
          needle_sha=$(rust_const WEIGHTS_SHA256 cactus-rs/src/needle/weights.rs)
          whistle_repo=$(sed -nE 's/^    repo: "([^"]+)",$/\1/p' cactus-rs/src/whistle/weights.rs)
          whistle_rev=$(rust_const WEIGHTS_REVISION cactus-rs/src/whistle/weights.rs)
          whistle_sha=$(rust_const WEIGHTS_SHA256 cactus-rs/src/whistle/weights.rs)
          mirage_repo=$(sed -nE 's/^    repo: "([^"]+)",$/\1/p' cactus-rs/src/mirage/weights.rs)
          mirage_rev=$(rust_const WEIGHTS_REVISION cactus-rs/src/mirage/weights.rs)
          mirage_sha=$(rust_const WEIGHTS_SHA256 cactus-rs/src/mirage/weights.rs)
          for name in needle_repo needle_rev needle_sha whistle_repo whistle_rev whistle_sha \
            mirage_repo mirage_rev mirage_sha; do
            [ -n "${!name}" ] || { echo "could not read $name from the sources"; exit 1; }
          done
          {
            echo "NEEDLE_WEIGHTS_URL=https://huggingface.co/$needle_repo/resolve/$needle_rev/needle3.cact"
            echo "NEEDLE_WEIGHTS_SHA256=$needle_sha"
            echo "WHISTLE_WEIGHTS_URL=https://huggingface.co/$whistle_repo/resolve/$whistle_rev/whistle.cact"
            echo "WHISTLE_WEIGHTS_SHA256=$whistle_sha"
            echo "MIRAGE_WEIGHTS_URL=https://huggingface.co/$mirage_repo/resolve/$mirage_rev/mirage.cact"
            echo "MIRAGE_WEIGHTS_SHA256=$mirage_sha"
          } | tee -a "$GITHUB_ENV"
      # Without weights every engine test skips, so fetch them once and keep them cached.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: weights
          key: weights-${{ env.NEEDLE_WEIGHTS_SHA256 }}-${{ env.WHISTLE_WEIGHTS_SHA256 }}-${{ env.MIRAGE_WEIGHTS_SHA256 }}
      - run: |
          mkdir -p weights
          [ -f weights/needle3.cact ] || curl -sfL "$NEEDLE_WEIGHTS_URL" -o weights/needle3.cact
          [ -f weights/whistle.cact ] || curl -sfL "$WHISTLE_WEIGHTS_URL" -o weights/whistle.cact
          [ -f weights/mirage.cact ] || curl -sfL "$MIRAGE_WEIGHTS_URL" -o weights/mirage.cact
          echo "$NEEDLE_WEIGHTS_SHA256  weights/needle3.cact" | shasum -a 256 -c -
          echo "$WHISTLE_WEIGHTS_SHA256  weights/whistle.cact" | shasum -a 256 -c -
          echo "$MIRAGE_WEIGHTS_SHA256  weights/mirage.cact" | shasum -a 256 -c -
          {
            echo "CACTUS_NEEDLE_WEIGHTS=$PWD/weights/needle3.cact"
            echo "CACTUS_WHISTLE_WEIGHTS=$PWD/weights/whistle.cact"
            echo "CACTUS_MIRAGE_WEIGHTS=$PWD/weights/mirage.cact"
          } >> "$GITHUB_ENV"
      - run: cargo test --all --all-features

  clippy-matrix:
    name: clippy (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The build script checks for libc++ on native Linux builds, clippy included.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # DOCS_RS skips the engine download and the libc++ check, so neither runner needs libc++.
  doc-matrix:
    name: doc (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
          DOCS_RS: "1"

  msrv-matrix:
    name: msrv (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
      - run: cargo check --workspace --all-features

  # The main ruleset requires checks named `clippy`, `doc` and `msrv`. Each matrix leg reports
  # under its own name, so these gates carry the bare names and fail unless every leg succeeded.
  # `if: always()` makes a gate run and fail on a red leg instead of being skipped, which the
  # ruleset would wait on forever.
  clippy:
    needs: clippy-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: test "${{ needs.clippy-matrix.result }}" = success

  doc:
    needs: doc-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: test "${{ needs.doc-matrix.result }}" = success

  msrv:
    needs: msrv-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: test "${{ needs.msrv-matrix.result }}" = success

  # No download feature: the build must refuse without an archive, and succeed with a local one.
  offline:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
      - name: refuses to build without an archive
        run: |
          if cargo build -p cactus-rs --no-default-features 2> refusal.log; then
            echo "built without an engine archive"; exit 1
          fi
          grep -q "CACTUS_LIB_DIR" refusal.log
      - name: read the engine pin
        run: |
          repo=$(sed -nE 's/^repo = "([^"]+)"$/\1/p' cactus-sys/prebuilt.toml)
          commit=$(sed -nE 's/^commit = "([0-9a-f]{40})"$/\1/p' cactus-sys/prebuilt.toml)
          sha=$(sed -nE 's/^macos-arm64 = "([0-9a-f]{64})"$/\1/p' cactus-sys/prebuilt.toml)
          release=$(sed -nE 's/^release = "([^"]+)"$/\1/p' cactus-sys/prebuilt.toml)
          for name in repo commit release sha; do
            [ -n "${!name}" ] || { echo "could not read $name from cactus-sys/prebuilt.toml"; exit 1; }
          done
          {
            echo "ENGINE_URL=https://huggingface.co/$repo/resolve/$commit/releases/$release/macos-arm64/libcactus.a"
            echo "ENGINE_SHA256=$sha"
          } | tee -a "$GITHUB_ENV"
      - name: builds against a local archive
        run: |
          mkdir -p engine
          curl -sfL "$ENGINE_URL" -o engine/libcactus.a
          echo "$ENGINE_SHA256  engine/libcactus.a" | shasum -a 256 -c -
          CACTUS_LIB_DIR="$PWD/engine" cargo build -p cactus-rs --no-default-features

  # Both crates must build from their own tarballs, in dependency order.
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
      - run: cargo package --workspace

  # Public API against the latest crates.io release. DOCS_RS keeps both builds (current and
  # baseline) from downloading or linking the engine; rustdoc JSON needs neither.
  semver:
    strategy:
      fail-fast: false
      matrix:
        package: [cactus-rs, cactus-sys]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCS_RS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          key: ${{ matrix.package }}
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: ${{ matrix.package }}
          rust-toolchain: manual

  # Licences, RustSec advisories, bans and sources, per deny.toml.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2

  # Every target the build script maps must still resolve, download and verify its archive.
  # `cargo check` runs build scripts but links nothing, so no target sysroot is needed beyond a
  # C compiler: build.rs compiles the libc++ shim for Linux targets, and ring (under ureq) has C
  # sources on every target.
  cross:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu
          - target: aarch64-linux-android
            apt: ""
          - target: x86_64-pc-windows-gnullvm
            apt: gcc-mingw-w64-x86-64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}
      - name: target C compiler
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            aarch64-unknown-linux-gnu)
              echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" ;;
            aarch64-linux-android)
              ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
              echo "CC_aarch64_linux_android=$ndk/aarch64-linux-android24-clang"
              echo "AR_aarch64_linux_android=$ndk/llvm-ar" ;;
            x86_64-pc-windows-gnullvm)
              echo "CC_x86_64_pc_windows_gnullvm=x86_64-w64-mingw32-gcc" ;;
          esac | tee -a "$GITHUB_ENV"
      - run: cargo check --workspace --target ${{ matrix.target }}

  # Every copy of a pinned value (engine commit, header and weight digests, crate version)
  # agrees with its source of truth. Both runners, because the script must work with BSD tools.
  pins:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/scripts/check-pins.sh
