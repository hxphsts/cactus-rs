name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The weights the engine tests run against, pinned like the engine archive itself.
  NEEDLE_WEIGHTS_URL: https://huggingface.co/Cactus-Compute/needle3/resolve/c7c415a3d1b3d929014bc6e866d51ebb971f7089/needle3.cact
  NEEDLE_WEIGHTS_SHA256: c9d915eca282ed42d1a09b143b592adb4cc6744ffe2d294adf5cfc5548170c38
  WHISTLE_WEIGHTS_URL: https://huggingface.co/Cactus-Compute/whistle/resolve/b358ddadd89b7a713b5aa131f23032d3cca1b251/whistle.cact
  WHISTLE_WEIGHTS_SHA256: b6e02f048568ac5d01a2042556c658061e699acbc0aa2a1439f52f3d461dffeb

jobs:
  # Two runners because the crate links a native static library: the archive,
  # the C++ runtime and the link line all differ per OS.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev
      - uses: dtolnay/rust-toolchain@stable
      # Without weights every engine test skips, so fetch them once and keep them cached.
      - uses: actions/cache@v4
        with:
          path: weights
          key: weights-${{ env.NEEDLE_WEIGHTS_SHA256 }}-${{ env.WHISTLE_WEIGHTS_SHA256 }}
      - run: |
          mkdir -p weights
          [ -f weights/needle3.cact ] || curl -sfL "$NEEDLE_WEIGHTS_URL" -o weights/needle3.cact
          [ -f weights/whistle.cact ] || curl -sfL "$WHISTLE_WEIGHTS_URL" -o weights/whistle.cact
          echo "$NEEDLE_WEIGHTS_SHA256  weights/needle3.cact" | shasum -a 256 -c -
          echo "$WHISTLE_WEIGHTS_SHA256  weights/whistle.cact" | shasum -a 256 -c -
          {
            echo "CACTUS_NEEDLE_WEIGHTS=$PWD/weights/needle3.cact"
            echo "CACTUS_WHISTLE_WEIGHTS=$PWD/weights/whistle.cact"
          } >> "$GITHUB_ENV"
      - run: cargo test --all --all-features

  clippy:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  doc:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
          DOCS_RS: "1"

  msrv:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --all

  # No download feature: the build must refuse without an archive, and succeed with a local one.
  offline:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: refuses to build without an archive
        run: |
          ! cargo build -p cactus-rs --no-default-features 2> refusal.log
          grep -q "CACTUS_NEEDLE_LIB_DIR" refusal.log
      - name: builds against a local archive
        run: |
          mkdir -p engine
          curl -sfL "$ENGINE_URL" -o engine/libneedle.a
          echo "$ENGINE_SHA256  engine/libneedle.a" | shasum -a 256 -c -
          CACTUS_NEEDLE_LIB_DIR="$PWD/engine" cargo build -p cactus-rs --no-default-features
        env:
          ENGINE_URL: https://huggingface.co/Cactus-Compute/needle3/resolve/c7c415a3d1b3d929014bc6e866d51ebb971f7089/macos-arm64/libneedle.a
          ENGINE_SHA256: a3b9163abe7b4bd52487c4005506cb35c5163bb9b9587af4ae07ed7587de697d

  # Both crates must build from their own tarballs, in dependency order.
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --workspace
